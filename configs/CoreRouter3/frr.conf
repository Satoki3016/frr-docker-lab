frr version 9.1
frr defaults traditional
hostname CoreRouter3
log syslog informational
!
interface cr3-leri
 ip address 10.1.5.2/30   ! ppp0 in OMNeT++
!
interface cr3-lere
 ip address 10.2.12.2/30  ! ppp1 in OMNeT++
!
! Routes to sender subnets via LER_Ingress (10.1.5.1)
ip route 10.0.1.0/24 10.1.5.1 1
ip route 10.0.2.0/24 10.1.5.1 1
ip route 10.0.3.0/24 10.1.5.1 1
! Routes to receiver subnets via LER_Egress (10.2.12.1)
ip route 10.2.1.0/24 10.2.12.1 1
ip route 10.2.2.0/24 10.2.12.1 1
ip route 10.2.3.0/24 10.2.12.1 1
! Peer routes for RSVP-TE signaling
ip route 10.1.5.0/30 10.1.5.1
ip route 10.2.12.0/30 10.2.12.1
! Default route via LER_Egress
ip route 0.0.0.0/0 10.2.12.1 10
!
line vty
!
