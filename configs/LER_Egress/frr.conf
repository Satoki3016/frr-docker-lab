frr version 9.1
frr defaults traditional
hostname LER_Egress
log syslog informational
!
interface lere-cr1
 ip address 10.2.10.1/30   ! ppp3 in OMNeT++
!
interface lere-cr2
 ip address 10.2.11.1/30   ! ppp4 in OMNeT++
!
interface lere-cr3
 ip address 10.2.12.1/30   ! ppp5 in OMNeT++
!
interface lere-rx1
 ip address 10.2.1.1/30    ! ppp0 in OMNeT++
!
interface lere-rx2
 ip address 10.2.2.1/30    ! ppp1 in OMNeT++
!
interface lere-rx3
 ip address 10.2.3.1/30    ! ppp2 in OMNeT++
!
! Return to Tx subnets: primary via CoreRouter1 (metric 1)
ip route 10.0.1.0/24 10.2.10.2 1
ip route 10.0.2.0/24 10.2.10.2 1
ip route 10.0.3.0/24 10.2.10.2 1
! Backup via CoreRouter2 (metric 2)
ip route 10.0.1.0/24 10.2.11.2 2
ip route 10.0.2.0/24 10.2.11.2 2
ip route 10.0.3.0/24 10.2.11.2 2
! Backup via CoreRouter3 (metric 3)
ip route 10.0.1.0/24 10.2.12.2 3
ip route 10.0.2.0/24 10.2.12.2 3
ip route 10.0.3.0/24 10.2.12.2 3
! Peer routes for RSVP-TE signaling
ip route 10.1.3.0/30 10.2.10.2 1
ip route 10.1.4.0/30 10.2.11.2 1
ip route 10.1.5.0/30 10.2.12.2 1
! Default route via CoreRouter1 (metric 10)
ip route 0.0.0.0/0 10.2.10.2 10
!
! MPLS static LSP - egress (label pop → IP forward)
! Tunnel 1: in=101 → pop, forward to Rx1 (10.2.1.2)
mpls lsp 101 10.2.1.2 pop
! Tunnel 2: in=201 → pop, forward to Rx2 (10.2.2.2)
mpls lsp 201 10.2.2.2 pop
! Tunnel 3: in=301 → pop, forward to Rx3 (10.2.3.2)
mpls lsp 301 10.2.3.2 pop
!
line vty
!
