frr version 9.1
frr defaults traditional
hostname CoreRouter2
log syslog informational
!
interface cr2-leri
 ip address 10.1.4.2/30   ! ppp0 in OMNeT++
!
interface cr2-lere
 ip address 10.2.11.2/30  ! ppp1 in OMNeT++
!
! Routes to sender subnets via LER_Ingress (10.1.4.1)
ip route 10.0.1.0/24 10.1.4.1 1
ip route 10.0.2.0/24 10.1.4.1 1
ip route 10.0.3.0/24 10.1.4.1 1
! Routes to receiver subnets via LER_Egress (10.2.11.1)
ip route 10.2.1.0/24 10.2.11.1 1
ip route 10.2.2.0/24 10.2.11.1 1
ip route 10.2.3.0/24 10.2.11.1 1
! Peer routes for RSVP-TE signaling
ip route 10.1.4.0/30 10.1.4.1
ip route 10.2.11.0/30 10.2.11.1
! Default route via LER_Egress
ip route 0.0.0.0/0 10.2.11.1 10
!
! MPLS static LSP - transit (label swap)
! Tunnel 2: in=200 → swap 201, via LER_Egress (10.2.11.1)
mpls lsp 200 10.2.11.1 201
! Tunnel 3: in=300 → swap 301, via LER_Egress (10.2.11.1)
mpls lsp 300 10.2.11.1 301
!
line vty
!
