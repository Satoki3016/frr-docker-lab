frr version 9.1
frr defaults traditional
hostname CoreRouter1
log syslog informational
!
interface cr1-leri
 ip address 10.1.3.2/30   ! ppp0 in OMNeT++
!
interface cr1-lere
 ip address 10.2.10.2/30  ! ppp1 in OMNeT++
!
! Routes to sender subnets via LER_Ingress (10.1.3.1)
ip route 10.0.1.0/24 10.1.3.1 1
ip route 10.0.2.0/24 10.1.3.1 1
ip route 10.0.3.0/24 10.1.3.1 1
! Routes to receiver subnets via LER_Egress (10.2.10.1)
ip route 10.2.1.0/24 10.2.10.1 1
ip route 10.2.2.0/24 10.2.10.1 1
ip route 10.2.3.0/24 10.2.10.1 1
! Peer routes for RSVP-TE signaling
ip route 10.1.3.0/30 10.1.3.1
ip route 10.2.10.0/30 10.2.10.1
! Default route via LER_Egress
ip route 0.0.0.0/0 10.2.10.1 10
!
! MPLS static LSP - transit (label swap)
! Tunnel 1: in=100 → swap 101, via LER_Egress (10.2.10.1)
mpls lsp 100 10.2.10.1 101
!
line vty
!
